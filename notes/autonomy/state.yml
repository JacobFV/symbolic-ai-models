    THREE SIGNALS OF THREE DIFFERENT KINDS: positional (a quantity sits beside
    its site), cross-role (that site was given away), structural (the domain
    says this role holds ONE region -- `flooded` is multi-valued, which is
    exactly why arity is blind to needs->flooding). None is a stronger check;
    each reads a DIFFERENT FACT. Constructive form of the pairing law: to make
    a failure detectable, give the thing it corrupts a second independent
    reading.
