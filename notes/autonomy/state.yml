      FALSE, and it cost this session three mis-attributed findings. The two
      prior witness findings were absent from section 3 and grep on
      notes/findings/ would have found them in two seconds. The handover is a
      CURATED view and curation is lossy; it says where the edge is, not what is
      known. Restored to section 3 on 2026-08-18.

  - assumption: "Every advantage ratio assumes the world already exists."
    load_bearing_for: ["the ~5e7 constant", "every row of the cost table", "the certificate arm's maintenance advantages"]
    reason_to_revisit: >
      Measured this cycle: the build step costs 99,512 queries' worth of saving,
      which is real but bounded and is met by construction for filed domains.
      It is NOT met, and cannot currently be tested, for derived-from-observation
      domains -- which is the target APPROACH.md names.
