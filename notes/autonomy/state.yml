blockers:
  - "Every accuracy comparison against a language model is unrun and NOT QUOTABLE: needs paid API credentials. User's fork, ROADMAP item 0b."
  - >
    PARTLY CLEARED. Raw prose is on disk via OpenAlex and the first arrow is
    measured. What remains blocked is the BETTER corpus: CourtListener's v4 API
    returns 401 and both bulk listings are closed (404/403). It is the strongest
    available test of this arrow because its 77M-edge citation map is ALREADY in
    this repo as ground truth and citations appear in opinions as prose -- a
    sentence-level extraction task, where OpenAlex offered only a short-string
    one. The token is FREE but requires registering an account, which is an
    outward-facing action under the user's identity. One signup unlocks the
    strongest version of the programme's weakest measurement.

research_debt:
  - assumption: "Every advantage ratio assumes the world already exists."
    load_bearing_for: ["the ~5e7 constant", "every row of the cost table", "the certificate arm's maintenance advantages"]
    reason_to_revisit: >
      Measured this cycle: the build step costs 99,512 queries' worth of saving,
      which is real but bounded and is met by construction for filed domains.
      It is NOT met, and cannot currently be tested, for derived-from-observation
      domains -- which is the target APPROACH.md names.
  - assumption: "The cost rows are input-token lower bounds with perfect accuracy assumed for both sides."
    load_bearing_for: ["every advantage ratio in HANDOVER section 3"]
    reason_to_revisit: "If accuracy is ever measured and the symbolic side is not perfect, every ratio moves."

last_cycle:
  action: >
    Built the dependency-certificate substrate and priced it on the first real
    corpus delta this repo has (two filed SEC 13F snapshots); ran two scouting
    arms in parallel worktrees.
  result: >
    Four findings. The read-set certificate is worth 0.3x-1.0x per quarter and
    37x-1,342x per filing; its ceiling is dependency size, not compute cost;
    splitting an optimum into a witness half and an optimality half is worth a
    further 95x. Both scouts contradicted a recorded prediction: the corpus DOES
    have a two-source property conflict (four airports), and scoping DOES
    survive a dense graph (wall time breaks first, not refusal).
  belief_update_final: >
    Four versions of the certificate claim in one day, three of them corrected
    by the next experiment. The keeper: logical form decides the growth rate of
    a claim's minimal dependency, and the instance decides whether you have gone
    far enough along it to notice. Build witnesses; refuse to fake minimality
    for universal claims.
  belief_update: >
    HANDOVER item 1 was the lower-value half of the right idea. Making every
    kernel report its read set buys 0.3x-1.0x. What pays is the logical form of
    the claim: report a WITNESS where the answer has one. Three results in this
    repo now say the cheap half of a problem is the useful half.

next:
  preferred_action: attack-the-0717-extraction-ceiling
  why_shipped_instead: >
    witness-on-kernelresult is DONE: `Witness` is on the kernel ABI, the ASP
    kernel returns its answer set instead of discarding it, and
    `KernelResult.maintainable` is true exactly when a witness is present --
    deliberately NOT for a proof of impossibility, however conclusive.
  why: >
    The residual 47% of the extraction ceiling is the whole question for the
    first arrow, and every advantage this repo publishes sits downstream of it.
    ROR's own reconciliation service and a full institution gazetteer are both
    untried and both symbolic; if either reaches the ceiling the bet holds, and
    if neither does then the arrow needs something that is not string matching.
  superseded_hub_labelling: >
    It is the newest finding's own named refuter. Meet-in-the-middle may not be
    the cheapest certificate for "no shorter path"; hub labelling and 2-hop
    covers are a literature built for exactly that. If one stays small at d=10,
    the witness/complement asymmetry weakens and the kernel contract just
    shipped needs revisiting.
  superseded_why: >
    Three measurements now agree that a kernel should return a WITNESS and
    should not pretend to return a minimal dependency for a universal claim.
    The 95x and the 13,987x are currently properties of two scripts.
    symbolic_ai_kernels/abi.py has the right shape already (check_entitlement)
    and the ASP kernel holds the model it throws away.
  alternatives:
    - reprice-the-5e7-constant-on-a-prose-corpus
    - shrinking-corpus-inverts-the-asymmetry
    - wire-witness-into-the-remaining-seven-kernels
