    SCOPE: agreement tests MUTUALLY EXCLUSIVE alternatives. Generated surfaces
    give role assignments where exactly one can be right, so disagreement means
    the reader guessed. Real prose gives candidates neither exclusive nor
    equivalent -- several partly-true descriptions of one entity. Agreement is
    vacuous there and demanding it DISCARDS CASES MORE LIKELY TO BE RIGHT.
