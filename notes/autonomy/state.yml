schema_version: 1
# Working memory across autonomous invocations. Not a bureaucracy: updated when
# the research state moves, not after every command. HANDOVER.md remains the
# human-readable cold-start document; this is the machine-readable one.
updated: 2026-08-18

mission:
  headline_correction_2026_08_18: >
    Cost ratio at FIXED QUALITY is the comparison anyone would make. By that
    measure the advantage is 1/f, and f -- the fraction of queries the system
    cannot settle -- is a property of the DOMAIN'S STRUCTURE-PROVENANCE, not of
    the technology. Filed structure (GLEIF, SEC): f = 0.216%, advantage 463x at
    quality 1.0. Derived structure (OpenAlex affiliations): f = 56%, advantage
    1.8x at quality 0.85. 259x between regimes, same formula and same code.
    Quoting either number without naming the regime is the error, and the
    repo's earlier million-fold figures were all measured in the filed regime.
  north_star: >
    $ per correct answer, an order of magnitude below neural inference, with the
    reasoning inspectable rather than inferred. Priced against a *realistic*
    opponent, not one handed the whole corpus.
  current_thesis: >
    The one capability that survived contact with a realistic retrieval opponent
    is dependency certification: naming exactly what an answer rests on. A
    retriever can certify determinacy in <=4 rounds but has no stopping rule and
    over-fetches 46x. The open question is whether the certificate is worth
    money, and the untested claim is that its value shows up not at query time
    but at *maintenance* time -- work not done when the corpus updates.

frontier:
  current_question: >
    Where else does an answer split into a half that has a witness and a half
    that does not -- and can a kernel be made to report the witness? The
    certificate ceiling is set by the LOGICAL FORM of the claim, and three
    results in this repo now say the cheap half of a problem is the useful half.
  why_it_matters: >
    It is the only lever measured to move the ceiling by two orders of magnitude,
    and it is a capability an LM has no analogue of: it cannot hand you a
    witness whose continued existence you can check for 30 nanoseconds.
  current_bottleneck: >
    Kernels return claims and a delta; none of them returns a witness. The ASP
    kernel already has the model in hand and throws it away.
  expected_unlock: >
    A witness field on KernelResult makes the 95x available to every solver
    answer in the repo rather than to one script.

measured:
  - claim: "A query pays for the conflicts it reads; 4,992 conflicts cost <=1 read per query."
    evidence: notes/findings/2026-08-18-a-query-pays-for-the-conflicts-it-reads-and-4992-of-them-cost-one.md
    commit: 5c4e283
  - claim: "The solver rung changes the answer on 15 of 3,044 hubs; the cheap bound is exact on 99.5%."
    evidence: notes/findings/2026-08-18-the-solver-rung-is-needed-on-15-hubs-out-of-3044.md
    commit: 467fa4d
  - claim: "99,738x of the published advantage was the framing; four query classes land within 1.2x at ~5e7."
    evidence: notes/findings/2026-08-18-the-advantage-curve-was-mostly-the-framing-and-what-is-left-is-a-constant.md
    commit: a528890
  - claim: "Ideal retrieval certifies determinacy in <=4 rounds; what it lacks is a stopping rule (1.128% silently wrong) and it over-fetches 46x."
    evidence: notes/findings/2026-08-18-retrieval-can-certify-determinacy-in-four-rounds-what-it-lacks-is-a-stopping-rule.md
    commit: 46e4a49
  - claim: "SEC 13F is on disk as two filed snapshots -- dec2025 3,473,209 rows and a later 3,822,885 -- so the corpus delta is real, not synthetic."
    evidence: data/sources/sec-edgar/commandagi-r2-2026-08-15/sec13f/
    commit: 9dd6970

  - claim: "A read-set dependency certificate is worth 0.3x-1.0x per quarter and 37x-1,342x per filing on SEC 13F; its ceiling is 1/P_hit with P_hit ~ r * keys_per_update / total_keys, so dependency size is the ceiling and compute cost only decides whether it is reached."
    evidence: notes/findings/2026-08-18-the-certificate-is-worth-nothing-per-quarter-and-1342x-per-filing.md
    commit: 2000e97
  - claim: "An optimum splits into an existential half with a 12-edge witness (P_hit 0.0300%, 3,309x) and a universal half that must read the complement (P_hit 2.8589%, 35.0x). 95x, and it buys a maintained bound rather than a maintained answer."
    evidence: notes/findings/2026-08-18-an-optimum-is-two-claims-and-one-of-them-is-95x-cheaper-to-keep.md
    commit: 7a0423b
  - claim: "The corpus does contain a genuine two-source property conflict after all: four airports (EUN, SMW, VIL on Western Sahara; PRN on Kosovo) where openflights and geonames disagree on country, surviving ICAO and name agreement."
    evidence: notes/findings/2026-08-18-the-corpus-does-contain-a-two-source-property-conflict-four-airports.md
    commit: 9b327e8
  - claim: "An existential claim's minimal dependency is the size of its witness (linear in the answer); its universal complement's is the excluded search space (grows with the ball). On the route network: 2.0x apart at d=2, 146x at d=6, 874x at d=10 where optimality is 32% of the corpus. On 13F's co-holding graph, which has no diameter, 0.2x."
    evidence: notes/findings/2026-08-18-a-witness-grows-linearly-and-its-complement-grows-with-the-ball.md
    commit: cf0f02f
  - claim: "Seven openflights IATA nodes are two airports each. Blast radius: airport_country 0.117% of nodes but 0.234% of ANSWERS -- a merged node is also a neighbour, so counting dirty nodes understates damage by 2x. range_limited_routing 0. Nothing published moves: 1-NN 0.9078 -> 0.9098."
    evidence: notes/findings/2026-08-18-seven-iata-nodes-are-two-airports-each-and-it-moves-the-headline-by-0-0021.md
    commit: HEAD
  - claim: "The 99,738x this repo retracted as 'just the framing' is the amortisation constant: breakeven = corpus_tokens/dependency_tokens = 4.08e6/41 = 99,512 queries, identical on both price sheets because our per-query cost is eleven orders below either. At 13F's 32% quarterly churn that is 350 queries/day to stay ahead of re-extraction."
    evidence: notes/findings/2026-08-18-the-framing-factor-we-retracted-is-the-amortisation-constant.md
    commit: pending
  - claim: "No source on disk carries raw prose. All 19 are (id,label,kind,body,source_url) or (source_id,target_id,kind); the longest natural-language field in 14 GB is a patent title at 59.4 chars mean; patentsview bodies are 0 chars; courtlistener is a 77M-edge citation map with no text column."
    evidence: scripts/extraction_breakeven.py docstring; verified across data/sources/
    commit: pending
  - claim: "The first arrow measured for the first time, on 5,000 OpenAlex works. Symbolic extraction from prose reaches F1 0.379 on unseen affiliation strings -- 52.9% of a 0.717 ceiling the task itself imposes, because OpenAlex labels institutions per AUTHOR not per string so the label is not a function of the input. Three principled improvements over a naive dictionary bought +0.077."
    evidence: notes/findings/2026-08-18-the-first-arrow-is-cheap-and-bad.md
    commit: d45c9c3
  - claim: "Cost per CORRECT extraction favours the symbolic extractor by at least 1,766,210x whatever a model scores, since a model cannot exceed F1 1.0. First credential-free bound on the comparison ROADMAP 0b blocks."
    evidence: same finding, section C
    commit: 0cf99cd
  - claim: "The crossover does NOT transfer across corpora: 5,242 on prose against GLEIF's 99,512, because corpus_tokens scales with corpus size. The transferable term is the dependency -- 302 tokens on prose against 41, i.e. 7.4x larger."
    evidence: same finding, section A
    commit: 0cf99cd
  - claim: "A ZERO-SHOT ROR registry lookup beats a dictionary learned from 3,500 works on all three splits (+0.039, +0.103, +0.059) with no training data and at 41,668 ns against 96,915. 'External resources are givens' validated where it matters."
    evidence: notes/findings/2026-08-18-a-zero-shot-registry-beats-a-learned-dictionary-and-both-plateau-at-62-percent.md
    commit: 7722dd2
  - claim: "Six symbolic extraction rungs plateau at 62.3% of a measured ~0.99 ceiling. Ordering identical on three splits and the tuned split is the WORST, so the tuning debt did not bite."
    evidence: same finding
    commit: 7722dd2
  - claim: "The extraction residual is DISAMBIGUATION, not retrieval: 1 string in 6,489 produced no candidate, and 38.2% of true institutions are never proposed because a near-identical name was. 'University of Wisconsin' names 13 ROR campuses and the city that separates them is in the input string, unread."
    evidence: same finding, error breakdown
    commit: 7722dd2
  - claim: "The 0.717 extraction ceiling I published was my own task construction (flattened authorships). Corrected: 0.988 F1 / 98.2% exact. The label IS a function of the input and the shortfall is genuine extraction failure, not label noise."
    evidence: notes/findings/2026-08-18-the-first-arrow-is-cheap-and-bad.md section D bis
    commit: fef77b3
  - claim: "A geography view added to entity linking is worth nothing under three admission rules (-0.036, -0.007, -0.001 against abstaining). It recovers 81% of the damage that relaxing abstention does and never gets ahead. 65% of ambiguous components carry no geographic evidence."
    evidence: notes/findings/2026-08-18-a-second-view-that-undoes-a-mistake-without-being-worth-making-one.md
    commit: 1130169
  - claim: "Extraction error amplifies 1.85x into aggregate queries, and recall is what dies: precision holds at 84-94% while collaborators recall falls to 20.4%, because an abstaining extractor builds a world with HALF the entities (2,270 vs 4,539). A count over it is off by 100%."
    evidence: notes/findings/2026-08-18-the-extractor-that-wins-on-facts-loses-on-every-answer.md
    commit: 61da9ea
  - claim: "The extractor that wins on fact-level F1 by 0.121 LOSES on every aggregate query (collaborators +0.085, works_at +0.058, count error halved for the worse-on-facts one). Two defensible metrics rank the two extractors inversely, and the one this programme optimises corresponds to nothing a user asks for."
    evidence: same finding
    commit: 61da9ea
  - claim: "Monotone queries (union, intersection) tolerate over-generation and the one non-monotone class tested (set difference, antitone in its second argument) does not: completeness wins +0.177 on intersection and loses -0.117 on difference. Same axis as the witness result."
    evidence: notes/findings/2026-08-18-monotone-queries-repair-a-noisy-world-and-non-monotone-ones-cannot.md
    commit: 4cbf891
  - claim: "Intersection's noise filtering requires INDEPENDENT errors. works_at_both precision is 95.1% on co-occurring institution pairs and 8.1% on registry-CONFUSABLE ones -- below the 36.5% fact-level rate. Over-generation is free where disambiguation is not needed and ruinous where it is."
    evidence: same finding, correction section
    commit: f3d6010
  - claim: "The Witness contract is carried by 4 kernels of 8 (asp, smt, lean, datalog-opt-in). The other four split three-way rather than two: egraph COULD carry one (its equivalent_form claim's witness is the rewrite sequence, unrecorded) and rigid/geo/economy have none to have, because a pose, a geodesic distance and a consolidated total are function evaluations rather than searches."
    evidence: tests/test_witness.py::TestWitnessCoverage
    commit: pending
  - claim: "The cost advantage at FIXED QUALITY is 8.1x, not 10^6. Escalating the 12.3% of extraction cases where the symbolic layer produces nothing takes it from 2,061,364x to 8.1x; reaching 83.5% quality costs 2.0x. The advantage is 1/f where f is the escalated fraction, and the million-fold numbers exist only at f=0, i.e. at 52.6% quality."
    evidence: notes/findings/2026-08-18-the-million-fold-advantage-is-8x-the-moment-you-escalate-anything.md
    commit: pending
  - claim: "The extractor cannot tell what it knows: its `certain` tier scores F1 0.666 against a pre-registered 0.7 threshold, and beats `ambiguous` by only +0.150. But SILENCE is a good escalation signal -- escalating it buys 1.00 quality per unit escalated against ambiguity's 0.48, because silent cases score 0.000 and nothing is re-bought."
    evidence: same finding
    commit: pending
  - claim: "Scoping survives a dense graph. On the filed-real routing mixture: read p50 1, max 8, 0 refusals in 250 queries, anchor 179/179. What breaks is wall time -- 48.3 ms/query against GLEIF's 2.8 us -- and the governing variable is conflict rate x read footprint, not topology."
    evidence: notes/findings/2026-08-18-scoping-survives-a-dense-graph-and-what-breaks-is-wall-time-not-refusal.md
    commit: 2b8443d

beliefs:
  - claim: "The certificate results are stated against an opponent that re-derives everything per update. Against incremental view maintenance (DBSP, differential dataflow) the advantage would be far smaller and possibly inverted."
    confidence: 0.85
    basis: "IVM maintains the answer at delta cost instead of re-deriving it; the numbers here carry no claim against a database"
    falsifier: "an IVM system that cannot maintain an answer produced by an external solver with no per-query delta rule"
  # FALSIFIED 2026-08-18. Held at 0.8 and wrong. Reading the same two filed
  # snapshots in the opposite order makes the corpus shrink for real, and the
  # asymmetry narrows 93x -> 72x rather than inverting -- exactly the 23% rise
  # in the deletion rate. Dependency size dominates; corpus direction is
  # second-order. Kept here rather than deleted, because a belief recorded so a
  # contradiction would be a finding should show the contradiction.
  - claim: "Most kernels in this repo have a witness available and discard it. The ASP kernel holds the model and returns only claims."
    confidence: 0.7
    basis: "read of symbolic_ai_kernels/asp/kernel.py; the cover script had to re-extract picked filers by hand"
    falsifier: "auditing the eight kernels and finding the answers are mostly not existential"
  - claim: "airport_country's published accuracy is not quotable as it stands, because its ground truth IS openflights' in-country edge -- one side of the very disagreement it is scored against -- and openflights merges distinct airports sharing an IATA code."
    confidence: 0.75
    basis: "reported by the two-source conflict arm; blast radius under audit"
    falsifier: "the audit finds the contaminated nodes never appear in the task's instances"

unknowns:
  - question: "Do openflights and geonames both carry a country for the same place, and do they disagree?"
    importance: "Would be the first genuine two-source property conflict in the corpus; three findings in a row have said there is none."
    cheapest_discriminating_test: "join on coordinates/IATA and diff the country field"
  - question: "Does scoping buy anything on a dense graph?"
    importance: "Parked with a prediction that it buys little; a contradiction is publishable."
    cheapest_discriminating_test: "possible_answers_scoped over range_limited_routing on the route network"
  - question: "Is the ~5e7 fact-in-kernel vs fact-in-prompt constant a property of 20-character identifiers?"
    importance: "It is the whole cost argument's remaining constant."
    cheapest_discriminating_test: "re-price on a prose corpus (gutenberg, stackexchange)"

