research_debt:
  - assumption: "The cost rows are input-token lower bounds with perfect accuracy assumed for both sides."
    load_bearing_for: ["every advantage ratio in HANDOVER section 3"]
    reason_to_revisit: "If accuracy is ever measured and the symbolic side is not perfect, every ratio moves."

last_cycle:
  action: >
    Built the dependency-certificate substrate and priced it on the first real
    corpus delta this repo has (two filed SEC 13F snapshots); ran two scouting
    arms in parallel worktrees.
  result: >
    Four findings. The read-set certificate is worth 0.3x-1.0x per quarter and
    37x-1,342x per filing; its ceiling is dependency size, not compute cost;
    splitting an optimum into a witness half and an optimality half is worth a
    further 95x. Both scouts contradicted a recorded prediction: the corpus DOES
    have a two-source property conflict (four airports), and scoping DOES
    survive a dense graph (wall time breaks first, not refusal).
  belief_update: >
    HANDOVER item 1 was the lower-value half of the right idea. Making every
    kernel report its read set buys 0.3x-1.0x. What pays is the logical form of
    the claim: report a WITNESS where the answer has one. Three results in this
    repo now say the cheap half of a problem is the useful half.

