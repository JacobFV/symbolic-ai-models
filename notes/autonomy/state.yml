built:
  - symbolic_ai_generators/flood/surface.py -- five-paragraph observation
    surface, exact span->claim alignment, distance/references/distractors/
    indirect statements. 12 tests in tests/test_flood_surface.py.
  - scripts/reader_arms.py -- the harness every arm plugs into. A reader is a
    case -> WorldSnapshot. Scores claim P/R, dependency-weighted recall against
    the ablation-measured dependency set, and end-to-end accuracy split by
    population, with oracle-world as ceiling.

next_actions:
  - Superlative-mediated coreference is now the whole remaining gap on this
    surface, and a rule for "lightest" dies under paraphrase exactly as the
    pattern arm did. This is the first place a lexical resource (WordNet is on
    disk) or a learned component is the only mechanism available, not a
    shortcut. Build it as an arm and measure at V=4.
  - The two-sided form is DERIVED and unfitted (see theory ledger). What it
    does not cover is which instances are feasible at p=0 -- capacity as a
    binding constraint on the original instance is a separate, co-dominant
    term. Deriving that would complete the unconditional curve.
  - The reader machinery on scheduling is still untried -- only the law was
    tested there.
  - The residual is exactly DEPOT vs FLOODED among the two leftover regions.
    Boundary ESTABLISHED rather than assumed this time: signature, adjacency,
    value vocabulary and domain invariants were all tried. Closing it needs
    relational knowledge (a depot is where vehicles start, flooding is an
    event), a different kind of external knowledge from a value list.
  - THE FRONT IS NOW A CONTENT READER, AND THAT IS MEASURED RATHER THAN
    ASSUMED. Headings and paragraph order are removable (unsaturate) and
    grouping too (interleave), alignment tested to survive both. The empty cell
    of the 2x2 is CLOSED to content-free reading -- see measured -- so the two
    candidate content-free mechanisms are struck: they would be built against a
    proof. What remains, in order:
      (a) DONE -- read_content_roles, 1.000 in all four cells. What is left is
          the ADVERSARIAL variant test: the four flooding phrasings happen to be
          reachable by five declared words, and "{w} went under overnight"
          already dodges them and survives only through elimination. A fifth
          phrasing built ADVERSARIALLY against the declared anchors would find
          the true floor. That is the honest next measurement and it is cheap.
          DONE TOO. Against four phrasings per role verified to contain no
          declared anchor: 1.000 -> 0.794 (half adversarial) -> 0.618 (all),
          landing EXACTLY on the emptied-anchor floor. So the 1.000 is a
          CEILING -- the arm is invariant to the paraphrases it HAS WORDS FOR --
          and the anchors never MISFIRE, so its failure mode is silence rather
          than error. Lexical generalisation is now justified against a measured
          gap of 0.382; enlarging the hand-declared list is NOT, because that
          memorises the generator one variant later.
      (a2) THE LIVE EDGE: let the reader EMIT CONSEQUENCES and the kernel BIND
          them. The reader can see a sentence says a region is unusable without
          knowing the word `flooded`; the routing kernel already knows an
          unusable region is what `flooded` means to it. That is a different
          mechanism from matching words and it is where the evidence now points.
          It also rhymes with the ambiguity machinery and directive 19: emit
          what is known, let the kernel decide, rather than collapsing to a role
          name the text never used.
      (b) DONE for all three, cardinal, and the prose blind spot is closed.
          audit_surface(prose=True) scores every sentence and flags text that
          shares a signature with a real claim kind -- a FALSE POSITIVE risk
          rather than an ambiguity. It rediscovered flood's disused-track
          defect unaided (the reader admits one spurious link in every one of
          20 cases), confirmed solvency clean, and flagged scheduling's _90
          distractors which its capability vocabulary already neutralises
          (0/20). One flag is a false alarm because the audit counts any bare
          number while the reader requires the unit -- the audit's notion of a
          number is COARSER than the reader's. So the scan is a RISK REGISTER,
          one check per flag.
          General observation from it: in BOTH flood and scheduling the
          declared external knowledge does DOUBLE DUTY -- settles signature
          collisions AND filters distractors.
      (c) the rules arm survives arrangement and dies on paraphrase; the
          signature arm the reverse. A reader combining them is not obviously
          impossible -- the closure is about the residual, not the whole task.
  - A THIRD ANSWER TYPE (a number, a ranking) would test whether "one shared
    check per answer type" is a real decomposition or an artefact of having
    only boolean and set.
  - Routing is ANSWERED and the answer is negative -- see measured. What would
    reopen it: an UNSOUND cheap arm whose error rate is predictable from
    pre-run world features, or a cost spread beyond the 2.14x max measured.
    Neither exists in these three domains today, so building a router now would
    be optimising a choice that does not exist.
  - The oracle is still the scaling wall on scheduling. Reaching 40 jobs /
    5 machines needs either a bound that survives near-exact fit (the capacity
    bound goes dead there and memoisation bought nothing -- real-valued
    durations mean states never repeat) or ground truth from a source other
    than exhaustive-with-pruning. This gates any experiment wanting the
    phase transition at scale.
  - Grounding now has three levels -- token, route adjacency, and CONTRADICTION
    against the structured answer -- and the renderer passes all three 40/40.
    The remaining hole is a real quantity attached to the wrong entity when no
    route or polarity claim is made; role-level binding would close it.
  - Ambiguity budget on solvency: is it again concentrated on the claim that
    SIZES the answer -- in flood the demand, here plausibly the threshold or
    the decision date? Measurable with what now exists.
  - The temporal policy is hand-written per domain, which argues the reader
    should EMIT the time and let a kernel decide rather than resolve it. That
    is testable against the ambiguity machinery already built.
  - Then domain transfer (scheduling or solvency): does WORLD IR + FLOW +
    KERNEL survive a domain change, and does the F = trivial-answer-share
    decomposition reproduce?
  - Renderer: structured answer -> grounded answer paragraph, kept separate from
    the canonical answer so generation quality cannot contaminate reasoning
    evaluation.

