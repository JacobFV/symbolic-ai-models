    THE ARC, AND ITS CORRECTION: I first attributed the difference to the BOUND
    -- "ambiguity is cheap to carry when the hypothesis about it is small". That
    is WRONG, and the experiment run to test it said so. Varying only the bound
    on the SAME collision gives k=0 decided 1.000 / sound 0.433, k=1 decided
    0.067 / sound 0.867, k=3 decided 0.017 / sound 1.000: decidedness collapses
    at the FIRST step and there is no usable middle anywhere.
    The real variable is DEPENDENCY. A spurious link is often inert because the
    network has other paths; a misassigned role never is -- it moves the depot,
    the destination or the flooding. AND THE AUDIT ALREADY MEASURED THIS: its
    collision cost is 0.000 for bridge_on/link and 0.625 for
    depot+flooded+needs, which predicts free vs vacuous exactly. That is a
    SECOND USE for the instrument -- collision cost forecasts whether
    emit-rather-than-collapse will be usable, offline and before any reader.
    CORRECTED TWICE. "Cheap when COLLISION COST is low" was also wrong:
    collision cost measures PERMUTATION between kinds and is 0.000 for
    bridge_on/link because their ROLE SIGNATURES DIFFER, while what that policy
    carries is a SPURIOUS CLAIM explored by DELETION. Two quantities, both low
    for unrelated reasons, coincidence read as prediction.
    The controlling variable is DEPENDENCY UNDER THE PERTURBATION BEING CARRIED:
    flood link deletion 0.138 (carried free), flood role reassignment 0.467
    (carried vacuous), solvency owns deletion 0.000 (inert -- every member is
    recoverable from its own filing). Separation 3.4x. Note roles are NOT always
    load-bearing as I claimed: 0.467, not 1.0.
    THE FORM IS NOW DERIVED AND MEASURED: decided = (1-d)^n, since carrying
    at-most-one-spurious-of-kind-K decides exactly when no single deletion is
    load-bearing. NO FREE PARAMETER -- d and n are both measured -- so it tests
    INDEPENDENCE rather than fitting. Mean absolute residual 0.036 over nine
    kinds, signs both ways; the three singleton kinds are exact by construction
    and test nothing, the six multi-claim rows carry it at +0.006 mean signed.
    POOLED IT SAYS THE OPPOSITE (+0.131, "independence fails"), and that was
    the answer I predicted with a mechanism. Artefact of the case mix: on an
    already-empty answer almost every deletion is inert. THE TELL was five kinds
    reading exactly 0.433 -- flood's empty share -- with different n and d.
    Re-checked the earlier carrying result for the same trap: the decided ==
    correct identity holds WITHIN each population and non-empty reads 0.588, so
    pooling UNDERSTATED it. Check run, answer went the other way.
    CROSS-DOMAIN NOW, and my "only one domain" scope note was wrong: the law is
    about DELETION DEPENDENCY OF A CLAIM KIND, which every domain has and which
    needs no reader -- only the POLICY needs one. Three domains, twelve kinds,
    non-degenerate population: mean absolute error 0.033, signed bias +0.005, no
    free parameter. Extremes show the mechanism: solvency revenue decides 0.000
    (every filing moves the sum), solvency owns decides 1.000 (recoverable from
    the filings).
    TWO ESTIMATORS, AND THEY SWAP: per-case E[(1-d)^n] wins ONLY pooled (0.040
    vs 0.183, Jensen over a bimodal mix -- which is what the earlier +0.131
    really was, NOT correlation between deletions) and LOSES clean (0.051 vs
    0.033) because it SMOOTHS A DETERMINISTIC OUTCOME: within a case d comes
    from the very deletions tested, so truth is 0 for any k>=1 while (1-k/n)^n
    stays positive. Rule: mean-d on a homogeneous population, per-case only if
    you must pool.
    SCOPE: measured on TRUE worlds, so it characterises the DOMAIN, not a
    reader. A real policy enumerates over the READ world whose d and n differ,
    and comparing the two directly is the next available mistake.
    GUARD: collision_cost and deletion_dependency sit beside each other in
    audit.py documenting that they are NOT the same number, with a test
    asserting both.
  - "GROUNDED" MEANS CONSISTENT WITH WHAT WAS READ, NOT TRUE. ungrounded()
    builds its admissible edges from the routes the flow computed FROM THE READ
    WORLD, so a route over a claim the reader INVENTED is self-consistent and
    passes. Demonstrated on the hard-distractor surface, seed 1: true answer is
    EMPTY, the paragraph reads "truck_0 runs region_0 to region_3" over a road
    existing in no claim, and ungrounded() returns []. It catches RENDERER
    errors -- invented numbers, false orderings, contradiction with the
    structured answer -- and cannot by construction catch READER errors.
    "Grounded 1.000" is not a safety property unless the world is the oracle's.
    Scope now in the docstring and pinned by tests/test_grounding_scope.py,
    which asserts BOTH halves so it cannot be read as an excuse.
  - THE MILESTONE, HONESTLY MEASURED (V=4, interleaved, hard_distractors=True):
    oracle 1.000 at $1.78e-08; signature+content 0.500 at $3.69e-08 (2.1x);
    every other reader 0.000. Reader loss 0.500 MATCHES the worst kernel loss
    (no SMT 0.500), where the published table says reader loss 0.000 and kernels
    dominate. AND CLAIM RECALL IS THE WRONG READER COLUMN: signature+content
    scores 0.998 recall at 0.500 accuracy, because its failure is a claim it
    ADDS and recall cannot see a false positive -- yet recall is what the
    milestone reports as reader quality.
  - THE READER'S 1.000 WAS PROPPED UP BY A DEFANGED DISTRACTOR. The prose scan
    flagged that "A disused track once ran from X to Z" carries EXACTLY the link
    signature; the reader admits it every case. It was inert only because the
    generator drew its endpoints from _OUTSIDE, regions appearing nowhere else.
    Pointed at two REAL unlinked regions -- nothing else changed -- the
    signature+content reader falls 1.000 -> 0.367 grouped, 1.000 -> 0.383
    interleaved. Two region ids in one sentence are worth -0.633.
    The interleaved rows admit TWICE the spurious links and still scored 1.000
    published, because both phantom edges are inert: the reader was scored on a
    surface where its false claims could not matter.
    UNIFICATION: no content-free observable separates a disused track from a
    road, which is the SAME closure as depot vs flooded reached from another
    direction. Distractor rejection is not a separate task from role assignment.
    That is also why scheduling's capability vocabulary filters distractors --
    it IS content.
    SHIPPED: render_observation(hard_distractors=True), default False so every
    published number keeps its meaning. True is the honest setting.
  - AN INSTRUMENT THAT PREDICTS WHERE A READER WILL BREAK, BEFORE IT EXISTS.
    symbolic_ai_generators/audit.py computes, from the surface alone, which
    claim kinds share a sentence signature. Reproduces both known answers --
    flood 0.617 mass (irreducible part 141/1141 = 0.124, exactly the
    depot/flooded/needs group that breaks under interleaving), scheduling 0.000
    -- and PREDICTED solvency at 0.000 when that domain had no reader at all.
    The reader built afterwards (solvency/read_surface.py, the module it was
    missing) scores 1.000 accuracy and 1.000 filing recall in all six cells of
    V x arrangement.
    NOW CARDINAL, and it did not need dependency weighting. A collision is real
    ambiguity only if the colliding kinds share a ROLE SIGNATURE: link (a,b) vs
    bridge_on (a,b,via) is flood's LARGEST collision at 456 spans per thousand
    and has ZERO permutable cases -- structurally not ambiguity, because a
    reader recovering the roles already has them apart. With that filter flood
    reads 0.617 raw -> 0.161 real. Permuting the real ones in the TRUE world
    gives their cost: depot+flooded+needs 0.625, capacity+load_limit 0.550 on
    only 3.8% of spans. SPAN MASS IS THE WRONG WEIGHT -- it ranks these exactly
    backwards. Both refinements need NO READER, which is what lets the audit
    speak before one exists.
    NEAR MISS worth remembering: the first solvency reader scored 0.583 in all
    six cells -- identical across V and arrangement, exactly the signature of
    the structure-independence I was predicting. 0.583 is the MAJORITY-CLASS
    FLOOR; it answered False on all 60 cases, because solvency names its parent
    `group` with NO number and the entity pattern required one. Accuracy could
    not catch it; the OUTPUT DISTRIBUTION did, in one line.
  - THE GAP IS NOT LEXICAL, AND A THESAURUS IS WORSE THAN NO WORDS. WordNet
    installs; expanding the declared anchors by synset + direct hyponyms +
    direct hypernyms + derivational forms takes 6/6/5 tokens to 507/224/593 and
    RECOVERS NOTHING: adversarial phrasings 0.618 -> 0.588 (below the
    no-vocabulary floor), original phrasings 1.000 -> 0.735. Dropping tokens
    shared across roles helps the original slightly (0.794) and makes the
    adversarial much worse (0.412), because shared-token ambiguity was a BRAKE
    -- two roles matching falls through to elimination, one WRONG role is
    assigned confidently.
    Mechanism: the tight vocabulary's value was PRECISION, not coverage. For a
    component feeding a symbolic pipeline -- wrong claims propagate, missing
    ones merely fail to help -- precision dominates coverage, and automatic
    expansion trades away the silence-not-error failure mode that was the arm's
    virtue.
    The adversarial phrasings name roles by CONSEQUENCE ("nothing gets through",
    "where the fleet sleeps"). A thesaurus bridges flood->inundate, not
    flood->nothing gets through. What settles them is what a role DOES, which is
    the KERNEL's semantics rather than a dictionary's. NOT ruled out: a
    DISTRIBUTIONAL resource, which is situational where WordNet is taxonomic.
  - THE EMPTY CELL IS FILLED, BY ONE VOCABULARY. read_content_roles -- type
    signature for everything it determines, a declared anchor vocabulary for the
    one group it cannot -- scores 1.000 in ALL FOUR cells of phrasing x
    arrangement. First reader here invariant to both. Anchors were written into
    predictions.jsonl BEFORE the phrasing variants were read.
    Control: emptying the anchors costs 1.000 -> 0.710 interleaved (0.618 was
    n=34), so content is
    load-bearing (+0.382). Which content: FLOODING ONLY. Removing flooded
    anchors costs most (0.853), removing needs costs NOTHING (1.000), depot
    between (0.941) -- because needs is pinned by adjacency (1.000 claim recall,
    no content) and depot is single-valued so elimination reaches it, while
    flooding is the MANY-VALUED role and elimination cannot pin a set whose size
    it does not know.
    CORRECTION TO MY OWN EARLIER NOTE: the content-free floor is 0.710 (0.618
    at n=34), not the
    0.000 published for "the empty cell". Two of the new arm's gains are
    content-free and were simply missing before -- adjacency for needs, and
    never defaulting an unresolved region to flooded (which CUTS THE NETWORK).
    The closure finding is unaffected: it is claim-level, and depot/flooded sit
    at 0.471/0.632 recall with content removed.
    WORDNET IS NOT ON DISK -- ~/nltk_data/corpora holds only `words` and nltk is
    not installed. It was also not needed: five concept words closed the cell.
  - STRUCTURE IS LOAD-BEARING EXACTLY WHERE THE SIGNATURE DOES NOT FIX THE
    PREDICATE -- confirmed by manipulation, not only by correlation. Renaming
    flood's regions so the prefix carries the role (depot_3, flooded_1, site_2),
    with phrasings, arrangement, claims and answer IDENTICAL, moves interleaved
    accuracy 0.000 -> 1.000 while the grouped control stays 1.000 throughout.
    The shape is a PARTIAL CASCADE: typing one role of three recovers 0.500
    (depot by prefix, needs by adjacency, flooded by elimination) because
    adjacency only fires sometimes -- the same partiality that caps the
    enumerating arm at 0.324 decided. Partial determinacy buys immunity only
    through a SECOND mechanism, never on its own. The aggregate cross-domain
    comparison was CONFOUNDED (scheduling is 100% self-contained vs flood's
    75.5%); what settled the mechanism was the per-kind decomposition -- every
    claim flood loses is self-contained, and the two kinds realised entirely by
    a pronoun lose 0.000.
  - THE CONTENT-FREE FRONT IS CLOSED ON ITS RESIDUAL. In the V=4 interleaved
    cell the blocker is depot vs flooded, both one-region/no-number/no-vehicle.
    Fingerprints DIFFER in 93.3% of cases -- but on node degree in a random road
    network, which is asymmetry, not information: the rule "depot is the
    highest-degree lone region" scores 33.3% against 28.5% chance. The
    architecture-independent test settles it -- rank-normalised observation ->
    role is NOT A FUNCTION, 21/21 role-slots ambiguous, all 7 distinct
    observations carrying all three roles. So no deterministic reader consuming
    entity types, numbers and registry membership can settle it, and the
    enumerating arm's 32.4% decided is a CEILING rather than an implementation
    limit. CONTENT IS REQUIRED -- the first place in this programme where a
    lexical resource is measured to be a necessity rather than assumed to be a
    shortcut.
  - ROUTING (directive 13) ANSWERED, NEGATIVELY, WITH NUMBERS. The escalation
    rule p*L > c1-c0 prices the cheap arm as a SUBSTITUTE; in both domains it
    is a COMPLEMENT and c1 depends on whether c0 ran. Flood: dropping datalog
    made the flow 1.78x MORE EXPENSIVE and less accurate, threshold NEGATIVE
    (-3.30e-08 USD). The two genuinely cheaper arms need a wrong answer to cost
    under 9.37e-09 / 2.63e-09 USD to be worth taking; per-case spread p50 1.08x,
    max 2.14x. Scheduling: the sound one-sided capacity gate removes 87.7% of
    solver time on 50.0% of instances -- 1.75x its fire rate, zero accuracy
    cost. Heuristic: run every sound cheap check, always; never route around
    one. A learned router has nothing to choose between yet.
  - THE ORACLE, NOT THE KERNEL, CAPS THE SCHEDULING DOMAIN. generate() ran an
    exhaustive itertools.product over n_machines**n_jobs -- 53.1s on one 18-job
    instance against milliseconds for the ASP kernel on the same world. Replaced
    with a pruned EXACT search (same verdicts, 2,721,429x faster); the brute
    force is kept as an executable specification and tests bind the two. Domain
    now reaches 80 jobs / 6 machines at 0.5ms/case. STILL THE BINDING
    CONSTRAINT at 40 jobs/5 machines and at slack exactly 0, where the capacity
    bound goes tight and the problem becomes exact partition.
  - MILESTONE (V=4, non-empty), CORRECTED: oracle world 1.000 task acc at
    $1.97e-08/correct; signature reader ALSO 1.000 at $2.03e-08 -- a 3% cost
    premium and ZERO reader loss. rules/lexical/template all 0.000. Kernel
    ablations: no SMT 0.500, no datalog 0.818, no ASP search 0.864, so the
    KERNEL losses dominate. Grounded paragraphs 1.000 everywhere.
    The earlier "reader loss 0.682 exceeds every kernel loss" headline was
    caused by a missing branch in my own reader and is WITHDRAWN.
  - STREAMING closed end to end: generating EPISODES (not just keys) from a
    6e12-address split peaks at 271 KiB against 473 KiB from a 24-address one
    (0.57x), and 10x the episodes costs +13%. Tokenizer now fits from a bounded
    deterministic prefix -- 1024 ids from 64 episodes -- with two fits of the
    same prefix required to agree. Cursor round-trips through a checkpoint dict.
    train() is deliberately UNTOUCHED: floors and one-pass rule induction want
    the whole training set, and only the batch-consuming neural control
    benefits.
  - SCHEDULING (third domain): reader claim precision and recall exactly 1.000
    at V=1..4 with NO coreference -- entity prefixes carry the type so the
    signatures separate outright. Renderer 40/40 grounded and distinguishes a
    capability failure from a packing failure. External knowledge slot is the
    CAPABILITY VOCABULARY, the lexical counterpart of flood's numeric value
    registry, and it doubles as the distractor filter.
  - GROUNDING DECOMPOSES: the contradiction check is reusable WITHIN AN ANSWER
    TYPE -- boolean_contradiction is now shared code between solvency and
    scheduling, parameterised only by the verdict phrases. Flood's set answer
    needs per-element polarity and keeps its own. The middle relational check
    is bespoke every time: route adjacency / date validity / capability
    validity.
  - SOLVENCY RENDERER: 60/60 grounded, and the explanation is BITEMPORAL --
    "Excluded as not yet knowable: sub_3 filed 169.91 USD dated 2026-06-01,
    after the determination". First explanation in the repo that must cite a
    DATE rather than a value. The grounding CONTRACT transfers (tokens, a
    domain-specific relation, contradiction against the structured answer) but
    the MECHANISM does not: it needed a boolean verdict form instead of
    per-vehicle polarity, and a date channel. The domain-specific middle check
    is route adjacency in flood and date validity here.
  - RENDERER: 40/40 flood cases produce a fully grounded answer paragraph, both
    polarities explained (including "no route reaches it at all: the network is
    cut by flooding in region_2 and region_4"). The checker is token AND
    adjacency level and is tested to FAIL on an invented quantity, an invented
    entity, and a false ordering of real regions.
  - reader arms on the five-paragraph surface, non-empty accuracy: oracle
    1.000; rules-full 1.000 (reaches the ceiling, so the surface is fair);
    rules-no-coreference 0.000; rules-with-distractors 0.682; lexical cue
    routing 0.136; template reader 0.000, identical to no reader at all.
  - coreference is decisive: removing it costs 1.000 -> 0.000 while global
    claim recall falls only 1.000 -> 0.895, because the DEMAND is pronoun-
    stated in every case and without it nothing can be sized.
  - distractors are cheap: admitting all of them costs precision 1.000 ->
    0.823 and only 1.000 -> 0.682 end to end.
  - generalisation: with 4 phrasings per claim kind drawn per case, the rules
    arm goes 1.000 -> 0.000 at V=2 (recall only halves, 1.000 -> 0.542) and the
    lexical arm 0.136 -> 0.000. Recall tracks 1/V.
  - the TYPE-SIGNATURE reader is flat across V and now scores 1.000 on claim
    recall, dependency recall and non-empty accuracy at V=1,2,3,4. Its one
    failure -- capacity recall 0.725 -- was a MISSING BRANCH: a sentence with
    one vehicle and no quantity fell through, so the pronoun's antecedent was
    never registered. Fixed with one clause and no lexicon.
  - SCOPE: F = P(truth == degenerate answer) holds on all THREE domains -- the
    degenerate answer is the empty set (flood), False (solvency) and True
    (scheduling), and at p=1 scheduling's accuracy is exactly its feasible
    share 0.850. But the law's monotone FORM fails on scheduling because its
    claims are opposite-signed evidence.
  - THEORY TRANSFER: the survival law holds on solvency with both parameters
    predicted in advance -- F 0.583 predicted / 0.590 fitted (1.1%), k 8.25
    predicted / 9.92 fitted (20.2%), rmse 0.0070. Trivial population dependency
    is exactly 0.00. Flood k = 8.31, solvency k = 9.92.
  - TRANSFER: the reader machinery works unchanged on solvency, a structurally
    opposite task (no routing, no subset answer, trivial kernel, bitemporal
    core). Signature reader 1.000 at every V; flood's "take the latest value"
    rule 0.850; first-filed 0.900; majority floor 0.583. Filing recall is 1.000
    for ALL arms, so the 15-point gap is purely how transaction_time is used.
  - POSITION IS A CRUTCH and two mechanisms replace it, soundness 1.000
    throughout: position ablated 72 worlds / 0.0% decided; + value registry
    (disjoint mass/capacity/demand vocabularies) 9 worlds / 36.4%; + adjacency
    (the needs site is the lone region immediately preceding the demand
    quantity) 2.5 worlds / 60.6% -- inside the <=4-world band where a bound is
    actionable. No content word is read. Consistency pruning buys NOTHING:
    every ambiguous reading is internally coherent, and the domain invariants
    (depot/needs never flooded, verified over 200 cases) are automatically
    satisfied by any role permutation.
  - carrying ambiguity is ALWAYS SOUND (1.000 on every row) and rapidly
    vacuous: 4 worlds decide 75.8% of the fleet, 72 worlds decide 0.0%
    (the 72 is the NO-REGISTRY rung -- with the registry and adjacency the same
    interleaved cell carries 2.5 worlds and decides 32.4%), and
    decidedness is NOT a function of world count -- 2 worlds of "bare" (which
    number is the demand) decide 45.5% while 4 worlds of "vehicle" decide
    75.8%. Collapsing instead scores 0.250 and cannot say when it is wrong.
  - hand-authored readers still collapse under phrasing variation: rules
    1.000 -> 0.000 at V=2, lexical 0.136 -> 0.000.
  - flood flow: 3 kernels, world->reach->world2->routes->loads->fused, agrees
    with a brute-force oracle that shares no code with the kernels
  - flood reader (regex template): 300/300 worlds round-trip exactly, and its
    own docstring says a human-written report would defeat it
  - parse fidelity: exact-set 1.000 at p=0, 0.500 at p=0.15, crosses the
    strongest floor (0.450) at p ~ 0.17
  - per-kind fragility at p=0.20: mass 0.733, capacity 0.747, link 0.800,
    demand 0.900, load_limit 0.907, flooded 0.960
  - certification (CLOSED): aim <= 1/(1-accuracy); curriculum models 7.7-32.9%
    accurate so their ceiling is 1.49x; federated arms 4.69x-57.5x
  - episode-level floor peeks at eval answers: 0.483 at 4 eps/lesson, 0.297 at
    32, so lifts across different n_eval are not comparable

theory:
  - name: detectability_from_arity
    status: empirical_three_domains
    formula: "a reader error is detectable only where the corrupted role carries a SECOND independent reading"
    consequence: >
      Detection needs redundancy; redundancy comes from the role's ARITY and from
      whether some other sentence pins the same fact; and NONE of that is
      correlated with how much damage an error there does. Measured the wrong way
      round in every domain tried: flood's undetectable misfire direction costs
      0.655 and its most detectable costs 0.865; scheduling's undetectable
      has_capability costs 0.210 with every failure UNSOUND while its detectable
      needs_capability costs 0.035; solvency's `owns` is multi-valued and its
      damage is the largest of the three. A system built to catch its own reading
      errors catches the ones it could most afford to make.
      BUT UNDETECTABLE IS NOT UNCERTIFIABLE, and the first version of this entry
      said otherwise. Every multi-valued channel measured admits INSENSITIVITY,
      which needs no second source and no arity -- flood link 0 wrong at 48.8%,
      scheduling has_capability 0 wrong at 52.5% with 43.5% free, solvency owns
      0 wrong at 48.5% all free. Only an AGGREGATING decision denies both
      (solvency revenue: every term moves the sum), which is why the repair there
      had to be in the READER and needed both halves.
    sources: >
      Three kinds, and each covers what the others cannot because each reads a
      DIFFERENT FACT -- positional (a quantity sits beside its site), cross-role
      (that site was given away), structural (the domain says this role holds one
      region). Where no other source exists, the only reading left is of the SAME
      sentence: does it withdraw what it asserts (staleness.py).
    scope: >
      The sentence-internal gate fails where the predicate IS a negation -- it
      cannot tell a sentence that withdraws its own claim from one asserting
      something WAS withdrawn, and flood's `flooded` is a cancellation. Property
      of the predicate, not of the cue list.
    floor: >
      A semantically stale sentence carrying NO lexical cue defeats every
      DETECTOR: solvency's uncued arm is 0.450 under every combination of them.
      Closing it by detection needs verb semantics (a past change-of-state whose
      result contradicts the claim), the first place an external lexical resource
      is the only mechanism rather than a shortcut.
      PARTLY LIFTED, and by the OTHER response rather than by a better detector:
      an insensitivity certificate on the uncued owns arm gives certified <=>
      correct exactly, 0.485 coverage and 0 wrong. It is the MONOTONE HALF (fires
      on 1.000 of false verdicts, 0.000 of true) and it is blind across channels,
      growing MORE confident as the corruption grows.
    evidence: runs/contradicting_evidence.json, runs/scheduling_hard_distractors.json, runs/solvency_hard_distractors.json, runs/staleness_gate.json
  - name: enumeration_soundness
    status: derived_premise_measured
    formula: "theta* in Theta  =>  (all candidates agree => correct)  and  (collapse wrong => candidates disagree)"
    variables:
      theta: the parameter the reader could not settle (here, the role assignment)
      Theta: the candidate set the reader emits
    consequence: >
      Where the read world can differ from the true one ONLY in theta, agreement
      among the emitted candidates is a SOUND AND COMPLETE detector of error in
      theta -- both directions follow because theta* and the collapsed choice are
      both in Theta. Three things follow that are not obvious:
      (1) no certificate can improve such an arm, it can only remove coverage
      (measured: 0.361 -> 0.056, 0 wrong both);
      (2) coverage is not a tunable, it IS the inert share of the ambiguity;
      (3) emission recovers no ACCURACY at all -- the decided set is a strict
      subset of what collapsing already got right (0 of 73 failures agree).
    scope: >
      The premise is the whole empirical content and it is CHECKABLE, not
      assumed. Any reader error outside the enumerated channel breaks it:
      turning the hard_distractors link channel on -- invented claims the role
      enumeration does not cover -- takes the same arm from 0 wrong to 40 of
      114 (soundness 0.649), and the link-deletion certificate restores 1.000 at
      0.127 coverage.
    predicts: >
      SOUNDNESS IS A PROPERTY OF THE PAIRING (channel, check), NEVER OF THE
      CHECK. For a new detector, ask which channels it enumerates or perturbs
      and which the reader can err on; the difference is the blind spot, and it
      is computable before running anything. Note this cannot be read off the
      signature audit: audit_surface scores the two flood surfaces IDENTICALLY
      (mass 0.640, same 280 prose flags) while soundness differs 1.000 vs 0.649.
    evidence: runs/ambiguity_at_the_lexical_floor.json, tests/test_emission_soundness.py
  - name: cheap_kernel_is_a_complement
    status: empirical_two_domains
    formula: "aim = (share of expensive cost removed) / (share of instances removed)"
    consequence: >
      The escalation model c_total = c0 + p*L*(escalate?) assumes the cheap arm
      SUBSTITUTES for the expensive one. Measured, it complements it: c1 is a
      function of whether c0 ran. Flood aim is undefined because removing the
      cheap kernel RAISES total cost (1.78x); scheduling aim = 1.75 with a
      sound gate. A cheap sound check earns its place when it performs an
      inference the expensive kernel cannot express LOCALLY, and its value
      concentrates where that kernel's local propagation is weakest -- not in
      proportion to its fire rate.
    mechanism: >
      Scheduling cost peaks at BARELY infeasible (slack -0.03, 62.9% of all
      solver time), not at deep infeasibility (0.2%) nor on the feasible side.
      There no single machine's #sum is violated by any partial assignment: the
      contradiction exists only in the sum ACROSS machines, and clingo's
      propagators are per-constraint. The gate computes that cross-machine sum
      in O(n).
    predicts: >
      A sound cheap check is worth most where the expensive kernel's
      constraints are LOCAL and the contradiction is GLOBAL. Testable on any
      new kernel by asking which scope the cheap check's inference spans.
    evidence: runs/routing_traces.json, runs/where_the_gate_fires.json
  - name: mixed_evidence_corruption
    status: derived_model_unfitted
    formula: "P(True|p) = prod_j [1 - (1-p)^2 (1-(1-p)^2)^m_j]"
    variables:
      p: claim drop rate
      m_j: machines carrying job j's capability, counted from the claims
    consequence: >
      Where claims are opposite-signed evidence the corruption curve is U-shaped
      and DERIVABLE with no free parameter: a job is a constraint only if both
      its claims survive, a machine is usable only if both of its do. Mean |err|
      0.070 and 0.069 at two slack settings on originally-feasible cases, both
      endpoints exact. Modelling only the capability channel gives the right
      shape at half the depth (0.234 / 0.172), so the second exponent is worth
      2.5x and was predicted rather than fitted.
    scope: >
      Predicts how corruption moves a FEASIBLE instance, not which instances are
      feasible. The unconditional curve needs a capacity term as well.
  - name: ambiguity_value
    status: empirical_regime
    formula: "decided% is not a function of |worlds|; it depends on WHICH group"
    consequence: >
      Carrying ambiguity is free soundness and is actionable only in a narrow
      regime -- half the fleet decided up to 4 worlds, nothing at 72. The bound
      goes vacuous long before enumeration becomes hard, so "can we afford to
      enumerate" is the wrong question. Spend reader effort on the distinctions
      whose ambiguity is EXPENSIVE, which is measurable per group in advance.
    evidence: runs/ambiguity_regime.json, 40 cases, soundness 1.000 on all rows
  - name: certification_ceiling
    status: exact_identity
    formula: "realised = recall/f_flagged; ceiling = 1/f_needed"
    consequence: >
      Do not optimise certification on low-accuracy systems. THREAD CLOSED.
    evidence: 5 independent rows, worst error 1.2%; the rest are identities
  - name: reader_survival
    status: screen_not_predictor   # DEMOTED: fitted on random loss, readers
                                   # lose systematically. Per-kind form
                                   # supersedes the flat one.
    formula: "S = F + (1-F) q^k;  non-empty answers: S = q^8.31, F = 0.014"
    variables:
      q: per-claim recall
      k: the answer's DEPENDENCY SIZE, measurable by ablation without a sweep
      F: the share of cases whose answer is corruption-proof (here, empty)
    consequence: >
      The published "floor" of 0.450 is exactly the empty-answer share (0.450
      measured, 0.400 fitted) and is NOT a reasoning baseline. On cases with a
      real answer there is no floor: a pure power law decaying to 0.018 at
      q=0.5. Required recall on answer-critical claims is q = 0.987 for 90%
      success on real cases, and at q = 0.90 the pipeline answers 41% of them.
      Report the two populations SEPARATELY -- a pooled score here is 45% a
      measure of the case mix. Entity attributes (mass 2.31, capacity 2.16)
      carry ~8x the leverage of the flooding relation (0.28).
    accuracy: >
      ~30%, not 1%. Pooled ablation vs fit agrees to 0.9% but that is two
      component errors cancelling; on non-empty cases mean d = 11.05 and
      k_eff = 10.91 against a fitted 8.31.
    precondition: >
      EVERY CLAIM MUST BE EVIDENCE IN THE SAME DIRECTION. Scheduling violates
      it: job claims are demand (dropping makes instances feasible, P(True)
      0.575 -> 1.000) and machine claims are supply (dropping makes them
      infeasible, 0.575 -> 0.000). The composite corruption curve is U-SHAPED
      (0.575, 0.400, 0.375, 0.575, 1.000) and a monotone form cannot fit it --
      it reports F = 0.593 where the true value is 0.850, rmse 0.08 against
      solvency's 0.007. Checkable before any sweep: drop each claim kind alone
      and see whether two kinds move the answer opposite ways.
    transfers: >
      CONFIRMED out of domain on solvency, with BOTH parameters predicted from
      structure before the sweep. F = P(truth == the degenerate answer), read
      off an empty world with no corruption: predicted 0.583, fitted 0.590,
      1.1% error. k = ablation dependency on the NON-TRIVIAL population:
      predicted 8.25, fitted 9.92, 20.2% error -- better than flood's own 31%.
      The trivial population has dependency EXACTLY 0.00 on all 35 cases.
      So required reader recall is computable for a new domain with no sweep:
      empty world -> F; ablate the non-trivial cases -> k.
    superseded_by: "S = prod_kind q_kind^d_kind, d_kind from ablation"
    when_it_works: >
      Confirmed where the loss is PURE RECALL. One pattern set against V
      phrasings gives q_kind = 1/V for every kind, so S ~ V^-6.95: at V=2 that
      is 0.008 and the measurement is 0.000. It over-predicts when a reader
      recovers claims with the WRONG VALUE (lexical arm, 0.476 predicted vs
      0.136 measured).
    why_demoted: >
      Tested predictively on four reader arms. The flat form is QUALITATIVELY
      wrong on the no-coreference arm: 0.835 dependency recall predicts 0.222
      and the truth is 0.000, because a single q assumes losses are
      exchangeable and a reader loses whole KINDS. The per-kind product gets
      that exactly (a lost kind sends the product to zero) but only moves mean
      error 0.137 -> 0.116, and still over-predicts the lexical arm 3.5x
      (0.476 vs 0.136). Use it to RULE OUT arms that lose a kind; do not
      forecast a number with it.
    next_test: >
      Does the decomposition reproduce on scheduling or solvency? If their
      floors are not their trivial-answer shares, F is not general.

beliefs:
  - The reader must be near-perfect on answer-critical claims, and only those.
    Dependency-weighted recall is likely a better target than global recall.
  - Ambiguity should be emitted, not collapsed. Kernels can branch or bound.
unknowns:
  - WHETHER ANY OF THIS SURVIVES TEXT NOBODY HERE WROTE. 37 GB in data/sources/
    and every number is self-generated. The one component testable without ground
    truth was 85% false positives on real prose. A READER on real text needs
    claim-aligned ground truth, which no corpus here ships -- structured sources
    have facts without prose, prose sources have prose without facts. sec-edgar
    has both and is the obvious frontier build.
  - ANSWERED for the sentence-internal form: a CANCELLATION gate reads the same
    sentence twice and repairs both domains' multi-valued channel. Still open --
    a second reading that is not sentence-internal, for a domain whose predicate
    IS a negation (flood's `flooded`), where the gate provably cannot work.
  - What the template reader does under paraphrase. corrupt() perturbs the
    recovered world; nothing perturbs the TEXT. This is the front's true zero.
  - Whether the F = trivial-answer-share decomposition transfers to another
    domain.
  - Precision failures (invented/misread claims) are unswept; MISREADS exists.

