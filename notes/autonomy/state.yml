calibration:
  measured: 2026-08-18, over 36 hypotheses with recorded outcomes
  confidence_works: >
    Mean confidence 0.69 on the predictions that landed inside their band, 0.58
    on the ones that were wrong. Do not adjust it.
  magnitude_is_biased: >
    13 over-optimistic, 1 mixed, 0 under-optimistic. I predict the magnitude a
    mechanism would have if it were the only thing operating, and the world
    supplies a second constraint I did not price -- coverage, correlation, a
    selection effect, an offsetting cost.
  guard: >
    Before writing a range, name what would CAP it and say whether that is
    measured. If the cap is unmeasured, state a bound rather than a band.
    See notes/lessons/2026-08-18-my-magnitude-predictions-are-over-optimistic-thirteen-to-nil.md

last_cycle:
  action: >
    Built the dependency-certificate substrate and priced it on the first real
    corpus delta this repo has (two filed SEC 13F snapshots); ran two scouting
    arms in parallel worktrees.
  result: >
    Four findings. The read-set certificate is worth 0.3x-1.0x per quarter and
    37x-1,342x per filing; its ceiling is dependency size, not compute cost;
    splitting an optimum into a witness half and an optimality half is worth a
    further 95x. Both scouts contradicted a recorded prediction: the corpus DOES
    have a two-source property conflict (four airports), and scoping DOES
    survive a dense graph (wall time breaks first, not refusal).
  belief_update_final: >
    Four versions of the certificate claim in one day, three of them corrected
    by the next experiment. The keeper: logical form decides the growth rate of
    a claim's minimal dependency, and the instance decides whether you have gone
    far enough along it to notice. Build witnesses; refuse to fake minimality
    for universal claims.
  belief_update: >
    HANDOVER item 1 was the lower-value half of the right idea. Making every
    kernel report its read set buys 0.3x-1.0x. What pays is the logical form of
    the claim: report a WITNESS where the answer has one. Three results in this
    repo now say the cheap half of a problem is the useful half.

next:
  preferred_action: price-the-certificate-arms-own-economics-with-the-new-metric
  why_now: >
    The north-star hole is CLOSED, not merely noted. symbolic_ai_core/cost.py
    now carries a Targeting denominator floored by blind escalation of the same
    share, and the federated resolver reads inf on $/solved-above-floor and
    4.69x at $1.31e-03 per quality point in the same row -- worthless at
    producing answers above its floor, worth paying for at certifying them.
    Validated against the two domains already measured, with the OpenAlex values
    hand-computed and recorded BEFORE the implementation: silence 2.13x,
    ambiguity 1.02x. The second is a sharper claim than 3i made -- the ambiguity
    signal is worth NOTHING over random spending, not merely less.

    The obvious next use is the one the new finding names as its own limit:
    escalation targeting is the EASIEST use of certification to price, and it is
    not the one the certificate arm (3b) has been measuring. A certificate that
    lets a downstream consumer skip revalidation -- the 93x/72x maintenance
    split, the 247x witness verification -- is worth something this column still
    cannot see. Those numbers exist and have never been expressed as capability
    per dollar against any floor.
  the_specific_gap: >
    Targeting prices "knowing which of MY answers are unsafe". The certificate
    arm measures "letting SOMEONE ELSE avoid recomputing". Both are
    certification and only the first is priced. The second needs a floor of its
    own -- plausibly "revalidate everything on a schedule" -- and that floor has
    never been written down.
  previous_preferred_action: price-certification-in-the-north-star-metric
  why_now: >
    The arc now has one defensible capability number and one clear gap.

    MEASURED: the federated resolver buys NO accuracy above a floor that shares
    its candidate sets (-0.1% at group level; cost.py prints inf). But its
    determinacy signal is nearly perfect -- settled 95.8% against unsettled
    40.4% at group level, and settled 93.6% at entity level, which is AT the
    93.0% candidate-recall ceiling. Priced where it acts: at a fixed 15.4%
    escalation budget, targeting the unsettled cases buys +9.2 points against
    blind escalation's +2.0. Certification is worth 4.69x.

    THE GAP: $/solved-above-floor prices getting the answer right and prices
    knowing-you-are-right at ZERO. The 4.69x appears in no column of the
    ledger. That is a gap in the repo's north-star metric, and the certificate
    arm (3b) measured exactly this property and was never connected to cost.
    Closing it is the mandate's own live edge -- make dependency certificates
    economically consequential -- and it is now backed by a measurement rather
    than an intuition.
  the_shape_of_the_fix: >
    A capability whose value is targeting is priced by the SAVINGS it enables at
    a fixed quality, not by the answers it gets right. Concretely: cost.py needs
    a denominator for "USD per point of quality bought by escalation", against a
    floor of blind escalation at the same budget. That is computable from what
    Capability already carries plus the settled/unsettled split, and it would
    have made the 4.69x visible in the same table that printed inf.
  general_finding_to_carry: >
    Determinacy is informative exactly when the candidate generator has high
    recall. This reconciles 3i (+0.150 F1, "the extractor cannot tell what it
    knows") with 3p (+55.4 points) using one mechanism: 93.0% candidate recall
    here against a lossy gazetteer there. ALWAYS report candidate recall beside
    a determinacy claim.
  previous_preferred_action: rebuild-the-arc-on-capability-above-floor
  why_now: >
    HANDOVER §7 item 10 had stood unaddressed and it was right. Six arms this
    session were priced with a hand-rolled advantage(f) that has NO SLOT for
    accuracy, so "settled" was silently read as "correct". Run through
    symbolic_ai_core/cost.py against a floor that picks at random among the same
    candidate sets, the federated symbolic resolver scores +0.9% above floor at
    entity level, -0.1% at group level, and DOES NOT BEAT ITS FLOOR -- the
    module prints its cost per unit of capability as inf, unprompted.

    The mechanism is clean and was invisible from inside the series: at group
    level closure determines the answer BECAUSE all candidates share a root, and
    if they share a root a random pick lands on it too. Determinacy is not
    accuracy. What the symbolic layer buys is knowing when it is right --
    certification, not capability -- worth 4.7x on $/capability-above-floor via
    escalation, against the 6.8x-12.2x cost ratios published.

    So the next work is not another arm. It is deciding what the programme
    claims now that its strongest recent numbers have been restated an order of
    magnitude down, and 4.7x is the first capability-above-floor number this
    session has produced.
  the_open_question: >
    If the symbolic layer's value is CERTIFICATION rather than accuracy, then
    the north star metric may itself be mismatched: $/solved-above-floor prices
    getting the answer right, and prices knowing-you-are-right at zero. The
    certificate arm (§3b) measured exactly that property and was never connected
    to the cost ledger. That connection is the highest-value unbuilt thing, and
    it is the mandate's own live edge -- make dependency certificates
    economically consequential.
  do_not: >
    Do not run another arm on the SEC/GLEIF workload, and do not quote any
    advantage from §3j-§3o without §3p beside it.
  previous_preferred_action: leave-the-finance-workload-and-test-the-arc-elsewhere
  why_now: >
    The reach arc is RESOLVED and it resolved into a conditional, which is the
    right shape. advantage = 1/f; f is set by reach; reach is purchasable
    (saturates ONLY where the workload concentrates -- 96.9% for 13F dollars,
    27.3% for GitHub events, a 3.5x span), derivable from recorded structure
    (81.3% where recorded, 22.4% of hard cases), or absent. The tiers are not
    independent: tiers 2 and 3 are gated by tier-1 identity coverage, which is
    asymmetric in the DIRECTION of the query -- 66.3% of held value toward the
    security, 23.2% toward the holder.

    Six arms have now run on one SEC/GLEIF workload. The filer column is blocked
    on data that is not on disk and that Form ADV does not supply (it carries
    CRD, not LEI, and neither SEC nor the vendored GLEIF file has addresses to
    join on). Grinding it further is the failure mode CLAUDE.md names.
  what_to_do_instead: >
    The arc produced three claims that are stated generally and measured on one
    domain: (1) coverage is asymmetric in the direction of the query, (2)
    crosswalk coverage is enriched toward the entities names cannot settle, (3)
    closure settles ambiguity where structure was recorded. Each is a claim about
    knowledge graphs, not about finance. patentsview (patent -> assignee),
    openalex (work -> institution) and courtlistener all have the same bipartite
    shape with an identity join and a name fallback. Porting the measurement is
    cheap and turns three finance observations into three general findings -- or
    kills them, which is worth more.
  blocked_and_recorded: >
    Filer-side identity coverage is 23.2% by AUM and cannot be improved from
    anything on disk. Form ADV was considered and REJECTED before download: it
    keys on CRD and SEC file number, carries no LEI, and the vendored GLEIF file
    has no address column to fall back on -- so it cannot close the join it was
    proposed for. Recorded here rather than tried.
  previous_preferred_action: acquire-form-adv-and-close-the-filer-column
  why_now: >
    The reach arc is now resolved and it ends on an asymmetry: over the SAME 13F
    edge, questions pointed at the security are 66.3% addressable by value and
    questions pointed at the holder are 23.2%. The residual f of 8.17% lives on
    the filer side, so it is NOT a tail phenomenon, and every lever tried so far
    (a second crosswalk, a second structural source) has failed on exactly that
    side.

    The finding names its own refuter and it is unusually cheap: Form ADV is the
    SEC's own registry of investment advisers -- the population wikidata misses
    entirely -- it is public, it carries CRD and SEC file numbers alongside legal
    and business names, and it is not on disk. If it lifts filer identity
    coverage from 23.2%, the whole filer column moves and every number in 3j-3n
    is recomputed on a better bridge. If it does not, identity coverage is a
    genuine wall and the programme should stop trying to buy its way past it.
  why_this_beats_the_alternatives: >
    It is the only untried lever that targets the side the residual f actually
    lives on. Every other candidate either re-measures the issuer side (already
    at 66.3%) or adds structure that cannot be addressed (measured null, 1.01x).
  acquisition_note: >
    Public SEC download, no credential, no payment -- inside the mandate's
    "download legally usable research data" clause. Check robots/terms and size
    before fetching; wget rather than curl, per the GLEIF lesson.
  previous_preferred_action: issuers-not-filers-does-identity-coverage-move
  why_now: >
    Federating a second structural source is a DEAD ARM: wikidata holds 4.3x
    more ownership structure than GLEIF (1,279,720 edges to 296,491) and settles
    3 more filers of 598, against a control settling ~1. Only 3,996 of those
    edges are expressible about LEIs because only 1.58% of GLEIF entities carry
    a wikidata twin. The tiers are NOT independent -- relief in tiers 2 and 3 is
    gated by tier-1 identity coverage, and tier 1 saturates.

    That null names its own cheapest refuter, and it is the next thing to run.
    The workload here is 13F FILERS -- asset managers and funds, which is
    exactly the population wikidata covers worst. The same machinery pointed at
    ISSUERS (the securities held, which are large listed operating companies)
    should show much higher QID coverage. If it does, the 1.58% is a property of
    the population rather than of federation, and the dead arm is only dead for
    filers. If it does not, the null generalises and identity coverage is the
    single binding constraint on the whole reach programme.
  screening_number: >
    Before federating another source's structure, measure what fraction of the
    target population carries that source's identity. 1.58% predicted the 1.01x
    yield here without building anything.
  previous_preferred_action: what-share-of-real-demand-is-group-level
  why_now: >
    Reach is now measured on all three tiers. Purchasable SATURATES (2,383 rows
    reach 68.8% of $51.4T; 2,281,221 reach 75.0%; 1.06x apart normalised at each
    crosswalk's own k). Derivable-from-recorded-structure WORKS at 81.3% and
    reaches 22.4% of the hard cases. ABSENT is 90% of GLEIF entities and is not
    a procurement problem. The two levers are near-orthogonal -- 1.49x and 1.22x
    compose to 1.80x -- and the residual f of 8.17% lives in tier 3.

    Everything in that paragraph is priced for a GROUP-LEVEL question. The 1.22x
    from closure is earned only by queries that can be asked about the group
    rather than the legal entity, and NOTHING measures what share of a real
    workload those are. That single unmeasured fraction is what stands between
    the three-tier result and a product claim, and it is the load-bearing
    unknown of the whole reach arc.
  blocked_note: >
    The honest version needs a real question distribution, which the repo does
    not have and cannot synthesise without assuming the answer. The tractable
    proxy: 13F-derived questions that a fund manager actually asks (exposure by
    group, by country, by sector) versus ones that require the legal entity
    (regulatory filing obligations, jurisdiction of incorporation). Classify the
    queries the vertical slice already answers before inventing new ones.
  previous_preferred_action: can-structural-reach-be-manufactured-from-closure
  why_now: >
    Reach was split into PURCHASABLE and STRUCTURAL, and the purchasable half is
    now measured and closed: it SATURATES. 2,383 curated crosswalk rows reach
    68.8% of $51.4T of 13F value; 2,281,221 filed rows reach 75.0%. A file 957x
    smaller answers 92% as much of what the workload weighs, and normalised
    against an oracle at each crosswalk's own k the two are 1.06x apart -- so
    neither is better targeted and the shape is pure value concentration. Buying
    more mappings will not close the 68x cliff.

    That leaves the structural half, and it is the half this repo's machinery is
    actually FOR. The question nobody has asked: can transitive closure over
    GLEIF's relationship graph REACH the 3,063 matched-but-unbridged filers from
    the 1,015 bridged ones? A filer whose parent or subsidiary is bridged is
    reachable by reasoning rather than by acquisition. If that works, symbolic
    closure buys reach money cannot -- which is the programme's central claim,
    tested on a real workload with a floor, rather than argued.
  previous_preferred_action: match-the-question-to-the-data-shape
  why_shipped_instead: >
    witness-on-kernelresult is DONE: `Witness` is on the kernel ABI, the ASP
    kernel returns its answer set instead of discarding it, and
    `KernelResult.maintainable` is true exactly when a witness is present --
    deliberately NOT for a proof of impossibility, however conclusive.
  why: >
    Monotonicity is now measured on the same axis four times -- twice before this
    session (witness verifies 247x cheaper, optimality certificate 2.0x dearer
    than re-solving) and twice in it (the 93x/72x maintenance split, and monotone
    queries repairing a noisy world while the antitone one cannot). The design
    consequence has been STATED and never built: world construction and answer
    construction want opposite defaults, and nothing in the architecture says so.
    The testable version is a ROUTER that reads a query's FORM -- monotone or
    not, decided without seeing the answer -- and sends it to the precise world
    or the complete one. That is also the mandate's stated long-term object,
    routing computation across heterogeneous components, and this repo has never
    measured a routing decision.
