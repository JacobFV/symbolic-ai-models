blockers:
  - >
    The 68x cross-source cliff is irreducible by modelling and needs ONE
    crosswalk file linking SEC CIK to GLEIF LEI. Nothing on disk carries it:
    SEC has no country, `same_as` is name-derived, and GLEIF's external
    identifier is the local company-register number (NVIDIA: Delaware 2862596)
    rather than the CIK (1045810). Candidate sources to try: SEC EDGAR
    company-facts or 13F cover pages, which sometimes carry an LEI; GLEIF's
    published relationship files; or an open crosswalk. This is the highest-value
    acquisition available -- it would move the federated advantage from 7x toward
    the 463x the single-source case already reaches.

  - "Every accuracy comparison against a language model is unrun and NOT QUOTABLE: needs paid API credentials. User's fork, ROADMAP item 0b."
  - >
    PARTLY CLEARED. Raw prose is on disk via OpenAlex and the first arrow is
    measured. What remains blocked is the BETTER corpus: CourtListener's v4 API
    returns 401 and both bulk listings are closed (404/403). It is the strongest
    available test of this arrow because its 77M-edge citation map is ALREADY in
    this repo as ground truth and citations appear in opinions as prose -- a
    sentence-level extraction task, where OpenAlex offered only a short-string
    one. The token is FREE but requires registering an account, which is an
    outward-facing action under the user's identity. One signup unlocks the
    strongest version of the programme's weakest measurement.

