schema_version: 1
# Working memory across autonomous invocations. Not a bureaucracy: updated when
# the research state moves, not after every command. HANDOVER.md remains the
# human-readable cold-start document; this is the machine-readable one.
updated: 2026-08-18

mission:
  headline_correction_2026_08_18: >
    Cost ratio at FIXED QUALITY is the comparison anyone would make. By that
    measure the advantage is 1/f, and f -- the fraction of queries the system
    cannot settle -- is a property of the DOMAIN'S STRUCTURE-PROVENANCE, not of
    the technology. Filed structure (GLEIF, SEC): f = 0.216%, advantage 463x at
    quality 1.0. Derived structure (OpenAlex affiliations): f = 56%, advantage
    1.8x at quality 0.85. 259x between regimes, same formula and same code.
    Quoting either number without naming the regime is the error, and the
    repo's earlier million-fold figures were all measured in the filed regime.
  north_star: >
    $ per correct answer, an order of magnitude below neural inference, with the
    reasoning inspectable rather than inferred. Priced against a *realistic*
    opponent, not one handed the whole corpus.
  current_thesis: >
    The one capability that survived contact with a realistic retrieval opponent
    is dependency certification: naming exactly what an answer rests on. A
    retriever can certify determinacy in <=4 rounds but has no stopping rule and
    over-fetches 46x. The open question is whether the certificate is worth
    money, and the untested claim is that its value shows up not at query time
    but at *maintenance* time -- work not done when the corpus updates.

frontier:
  current_question: >
    Where else does an answer split into a half that has a witness and a half
    that does not -- and can a kernel be made to report the witness? The
    certificate ceiling is set by the LOGICAL FORM of the claim, and three
    results in this repo now say the cheap half of a problem is the useful half.
  why_it_matters: >
    It is the only lever measured to move the ceiling by two orders of magnitude,
    and it is a capability an LM has no analogue of: it cannot hand you a
    witness whose continued existence you can check for 30 nanoseconds.
  current_bottleneck: >
    Kernels return claims and a delta; none of them returns a witness. The ASP
    kernel already has the model in hand and throws it away.
  expected_unlock: >
    A witness field on KernelResult makes the 95x available to every solver
    answer in the repo rather than to one script.

