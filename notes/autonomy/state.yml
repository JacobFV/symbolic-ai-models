# Working memory. Guides the present; it does not reproduce the project history.
# History lives in RESEARCH_LOG.md, notes/findings/, predictions.jsonl, git log.

thesis: >
  Can this system construct enough of the right world from observations that its
  already-cheap structured reasoning becomes useful end-to-end?

frontier: text -> world IR -> multi-kernel flow -> structured output + text

bottleneck: >
  World construction from observations. The middle of the pipeline is
  demonstrated -- typed world, explicit flow DAG, heterogeneous kernels,
  multi-kernel composition verified against an oracle sharing no code. The
  world is still RECEIVED from a generator rather than READ.

measured:
  - flood flow: 3 kernels, world->reach->world2->routes->loads->fused, agrees
    with a brute-force oracle that shares no code with the kernels
  - flood reader (regex template): 300/300 worlds round-trip exactly, and its
    own docstring says a human-written report would defeat it
  - parse fidelity: exact-set 1.000 at p=0, 0.500 at p=0.15, crosses the
    strongest floor (0.450) at p ~ 0.17
  - per-kind fragility at p=0.20: mass 0.733, capacity 0.747, link 0.800,
    demand 0.900, load_limit 0.907, flooded 0.960
  - certification (CLOSED): aim <= 1/(1-accuracy); curriculum models 7.7-32.9%
    accurate so their ceiling is 1.49x; federated arms 4.69x-57.5x
  - episode-level floor peeks at eval answers: 0.483 at 4 eps/lesson, 0.297 at
    32, so lifts across different n_eval are not comparable

theory:
  - name: certification_ceiling
    status: exact_identity
    formula: "realised = recall/f_flagged; ceiling = 1/f_needed"
    consequence: >
      Do not optimise certification on low-accuracy systems. THREAD CLOSED.
    evidence: 5 independent rows, worst error 1.2%; the rest are identities
  - name: reader_survival
    status: empirical_scaling_law
    formula: "S = F + (1-F) q^k,  k = 9.35, F = 0.338, rmse 0.015"
    variables: {q: per-claim recall, k: independently-required claims}
    consequence: >
      Reader needs q = 0.983 for S = 0.90, not the ">= 90%" the sweep was read
      as saying. k is additive across kinds: mass 2.31, capacity 2.16, link
      1.61, demand 0.73, load_limit 0.68, flooded 0.28 -- so entity attributes
      carry ~8x the leverage of the flooding relation. And S is more sensitive
      to k than to q: halving k is worth more than a much better reader, which
      argues for emitting ambiguity rather than for a bigger parser.
    next_test: >
      Does fitted k match the answer's DEPENDENCY SIZE, which the certificate
      machinery can measure directly? Agreement promotes this toward a
      mechanistic model; disagreement kills it.

beliefs:
  - The reader must be near-perfect on answer-critical claims, and only those.
    Dependency-weighted recall is likely a better target than global recall.
  - Ambiguity should be emitted, not collapsed. Kernels can branch or bound.
unknowns:
  - What the template reader does under paraphrase. corrupt() perturbs the
    recovered world; nothing perturbs the TEXT. This is the front's true zero.
  - Whether q^k transfers to a structurally different domain.
  - Precision failures (invented/misread claims) are unswept; MISREADS exists.

active_work: none -- turn ended after the theory pass

next_actions:
  - Build the multi-paragraph observation surface with exact span->claim
    alignment (5 paragraphs: actors, infrastructure, events, quantities, query).
  - Then 3-5 cheap reader arms measured at WORLD level plus end-to-end, with
    oracle-world as the ceiling and the gap decomposed into reader/kernel/
    renderer loss.
  - Test fitted k against measured dependency size (cheap, kills or promotes
    the law).

blockers:
  - Paid API credentials for any accuracy comparison against a language model
    (also gates the "lm parser ceiling" row of the reader table).
  - Free CourtListener API token (v4 returns 401).

calibration: >
  Magnitude predictions ran 13 over-optimistic to 0 before deliberate low
  shading; that then produced three under-calls. Recent failures were not
  magnitude but SPECIFICATION -- predicting one number for a product of two,
  and building a validation whose rows reproduced their own definitions.
