  - EMITTING THE AMBIGUITY DETECTS EVERY ERROR AND RECOVERS NONE, and the
    reason is a THEOREM not a measurement. At the lexical floor (every phrasing
    written to evade the declared anchors, so roles unforced on 252/252, mean
    2.48 candidate worlds), 400 seeds, interleaved: collapse 0.710 answering
    everything; ROLE FLAG COVERAGE 0.000 -- it refuses every case, so a detector
    calibrated where the vocabulary works has no discrimination where it fails;
    EMIT-ON-AGREEMENT 0 wrong at 0.361 coverage; emit+certificate 0 wrong at
    0.056. The 91 decided are a STRICT SUBSET of the cases collapse already got
    right -- 0 of the 73 collapse failures have agreeing candidates.
    THEOREM: where the read world can differ from the true one ONLY in the role
    assignment, the true assignment and the collapsed one are both among the
    candidates, so agreement => correct and wrong-collapse => disagreement.
    Sound AND complete detector by construction; empirical content is only the
    premise (504/504, bound 0.6%). COROLLARY: no certificate can improve
    emission on such a channel, it can only remove coverage -- which is exactly
    what 0.361 -> 0.056 is. Coverage is not a tunable; it IS the inert share.
    CONTROL, the load-bearing half: turn hard_distractors back on -- INVENTED
    LINKS, a channel enumeration does not cover -- and the same arm is 40 wrong
    of 114, soundness 0.649; the certificate restores 1.000 at 0.127. GENERAL:
    SOUNDNESS IS A PROPERTY OF THE PAIRING (channel, check), NEVER OF THE CHECK.
    Warning in the certificate's direction: it certifies MORE on the hard
    surface (0.127 vs 0.056) because phantom links add 2-edge-connectivity --
