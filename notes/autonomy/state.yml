# Working memory. Guides the present; it does not reproduce the project history.
# History lives in RESEARCH_LOG.md, notes/findings/, predictions.jsonl, git log.

thesis: >
  Can this system construct enough of the right world from observations that its
  already-cheap structured reasoning becomes useful end-to-end?

frontier: text -> world IR -> multi-kernel flow -> structured output + text

bottleneck: >
  World construction from observations. The middle of the pipeline is
  demonstrated -- typed world, explicit flow DAG, heterogeneous kernels,
  multi-kernel composition verified against an oracle sharing no code. The
  world is still RECEIVED from a generator rather than READ.

measured:
  - THE READER HEADLINE WAS POSITION. read_signature branches on pi==0..3 --
    hard-coded paragraph indices -- so the milestone's "signature reader 1.000,
    zero reader loss" was a reader that knows the five-paragraph template by
    position. Shuffling paragraphs takes it to 0.000 non-empty (claim recall
    1.000 -> 0.197). SECTION HEADINGS ARE WORTH NOTHING: no reader consulted
    them. Paragraph CO-OCCURRENCE fully replaces position --
    read_signature_roles holds 1.000 shuffled, consulting no content word, by
    reading paragraph roles off content (the paragraph carrying masses owns the
    depot, the one carrying the demand owns the needs site).
  - TWO READERS, TWO AXES, EMPTY INTERSECTION. Non-empty accuracy over 60
    cases, phrasing variation x interleaving (sentences shuffled globally,
    pronouns kept with their antecedents so the document stays TRUE):
      rules   V1/grouped 1.000  V1/inter 1.000  V4/grouped 0.000  V4/inter 0.000
      roles   V1/grouped 1.000  V1/inter 0.000  V4/grouped 1.000  V4/inter 0.000
    The rules arm matches phrasings so it survives rearrangement and dies under
    paraphrase; the signature arm reads types so it survives paraphrase and dies
    when structure goes. NEITHER IS A READER -- each is one invariance without
    the other. The honest front is a reader invariant to phrasing AND
    arrangement at once.
