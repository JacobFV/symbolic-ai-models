# Every generatable lesson. This is the config a result could come from.
#
#   uv run symbolic-ai-agents sweep --config configs/agents-full.toml --resume
#
# `--resume` matters: a full sweep is long enough that it will not always
# survive the session that started it, and losing five finished agents because
# the sixth was interrupted is the kind of waste that discourages running the
# honest experiment at all.

agent = "context"
envs = "choice,retry,repair,probe"
lessons = "all"

n_train = 20
n_eval = 8
vocab_size = 8192
max_nodes = 256

tries = 3
mask_rate = 0.15
max_steps = 8
max_actions = 24
probe_cost = 0.1
max_probes = 6

keep = 32
out = "runs/agents-full179"
