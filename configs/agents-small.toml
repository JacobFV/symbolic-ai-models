# A sweep that finishes in a few minutes on a CPU.
# Use it to check the wiring, not to draw a conclusion: six lessons is 3% of the
# curriculum, and the README records that a six-lesson slice once ranked this
# repo's models close to backwards against the full set.
#
#   uv run symbolic-ai-agents sweep --config configs/agents-small.toml --out runs/agents-small

agent = "context"
envs = "choice,retry,repair,probe"
lessons = "unification,symbol_grounding,center_embedding,context_free_language,palindrome,quantification"

n_train = 64
n_eval = 16
vocab_size = 2048
max_nodes = 128

# The environment settings. Every one of these is recorded in summary.json and
# checked across the rows of a comparison table by report.config_drift: two runs
# at different probe costs are different experiments.
tries = 3
mask_rate = 0.15
max_steps = 8
max_actions = 24
probe_cost = 0.1
max_probes = 6

keep = 64
out = "runs/agents-small"
