id: cskg
title: CSKG (Commonsense Knowledge Graph)
description: The consolidated commonsense graph over ConceptNet 5.7, WordNet 3.0, ATOMIC, FrameNet, Roget,
  Visual Genome and Wikidata-CS. Already vendored here in a narrow projection; this is the fuller staged
  cut.
