notes: '**The vendored copy in symbolic_ai_kg/data/ is a selectional projection, not this.** It collapses
  concepts by lemma, reads only selected relations and maps them into a small local relation set. Calling
  that projection ''CSKG'' is the same class of error as calling a slice a result, and it is renamed cskg_selectional_v1
  for exactly that reason. CSKG is itself a composite of seven upstreams, so an assertion ingested both
  directly and through CSKG is ONE observation seen twice -- see the double-counting test.'
