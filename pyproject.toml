[project]
name = "symbolic-ai-models"
version = "0.1.0"
description = "Train and evaluate symbolic text model architectures on one harness: next-token prediction and masked graph-node prediction over the formal language curriculum."
readme = "README.md"
requires-python = ">=3.12"
# The curriculum generator is no longer a dependency: it is vendored verbatim as
# `symbolic_ai_data/`, and it had no dependencies of its own.
dependencies = [
    "torch>=2.7",
    "numpy>=2.5.2",
]

[project.scripts]
symbolic-ai-models = "symbolic_ai_models.cli:main"
symbolic-ai-parsers = "symbolic_ai_parsers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["symbolic_ai_core", "symbolic_ai_models", "symbolic_ai_parsers",
                "symbolic_ai_data"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
