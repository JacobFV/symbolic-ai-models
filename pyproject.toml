[project]
name = "symbolic-ai-models"
version = "0.1.0"
description = "Train and evaluate symbolic text model architectures on one harness: next-token prediction and masked graph-node prediction over the formal language curriculum."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "langcurriculum",
    "numpy>=2.5.2",
]

[project.scripts]
symbolic-ai-models = "symbolic_ai_models.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["symbolic_ai_models"]

[tool.uv.sources]
langcurriculum = { git = "https://github.com/JacobFV/formal-language-cirriculum" }

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
